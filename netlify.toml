# GitHub Actions owns releases. See docs/cicd.md for mandatory host setup.
[build]
  # Skip Git-triggered Netlify builds so they cannot bypass GitHub approval.
  # CLI --no-build deployments still publish the verified GitHub artifact.
  ignore = "exit 0"
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.2"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Both aliases use optimized production assets; these are Netlify deploy
# contexts, not Vite --mode development builds.
[context.production]
  command = "pnpm build"
  publish = "dist"

[context.develop]
  command = "pnpm build"
  publish = "dist"

[context.qa]
  command = "pnpm build"
  publish = "dist"

[[headers]]
  for = "/deployment.json"
  [headers.values]
    Cache-Control = "no-store"
